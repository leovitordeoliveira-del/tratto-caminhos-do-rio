<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRATTO — Caminhos do Rio</title>
<style>
:root{--ink:#1d1d1b;--gold:#b88a3b;--cream:#f5f0e7;--paper:#fffdf9;--line:#ded3c1;--green:#176547}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,serif}
header{background:var(--cream);color:#1d1d1b;position:sticky;top:0;z-index:20;border-bottom:1px solid #b88a3b55}
.nav{max-width:1120px;margin:auto;padding:8px 18px;display:flex;align-items:center;justify-content:flex-start;gap:8px;overflow:hidden;min-width:0}
.brand{flex:0 1 auto;min-width:0;display:flex;align-items:center}.brand .logo{width:205px;height:68px;object-fit:contain;object-position:center;display:block}
.tratto-lang{display:flex;align-items:center;gap:4px;flex:0 0 auto;min-width:0}.tratto-lang button{box-sizing:border-box;width:31px;height:32px;flex:0 0 31px;padding:0;border:1px solid #b88a3b;background:#191918;color:#e4c579;font:700 9px Arial,sans-serif;cursor:pointer;border-radius:1px}.tratto-lang button.active{background:#b88a3b;color:#fff}
.location{margin-left:auto;flex:0 0 auto;white-space:nowrap;color:#1d1d1b;text-decoration:none;font:700 11px Arial;letter-spacing:.1em;border:1px solid #b88a3b;padding:10px 12px;background:transparent}
.hero{min-height:78vh;background:linear-gradient(120deg,#181818,#2b251e);color:white;display:flex;align-items:center;padding:65px 7vw;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:600px;height:600px;border:1px solid #b88a3b55;border-radius:50%;right:-220px;top:-180px}.hero .inner{max-width:850px;position:relative;z-index:1}.hero .mini{font:700 12px Arial;letter-spacing:.26em;color:#dfbd75}.hero h1{font-size:clamp(54px,8vw,104px);font-weight:400;line-height:.86;margin:22px 0}.hero h1 em{font-style:normal;color:#d2a657}.hero p{font-size:21px;line-height:1.55;max-width:720px;color:#eee}.cta{display:inline-block;margin-top:20px;padding:14px 18px;background:#b88a3b;color:#fff;text-decoration:none;font:700 11px Arial;letter-spacing:.1em}
.intro{background:var(--paper);padding:42px 7vw;border-bottom:1px solid var(--line)}.introgrid{max-width:1080px;margin:auto;display:grid;grid-template-columns:1.2fr .8fr;gap:40px}.intro h2{font-size:36px;font-weight:400;margin:0 0 10px}.intro p{font-size:18px;line-height:1.65}.route{border:1px solid var(--line);padding:22px;background:#fff}.route b{font:700 10px Arial;letter-spacing:.12em;color:var(--gold)}.route a{display:inline-block;margin-top:13px;color:var(--green);font:bold 12px Arial;text-decoration:none}
main{max-width:1100px;margin:55px auto;padding:0 18px}.stop{background:var(--paper);border:1px solid var(--line);display:grid;grid-template-columns:44% 56%;margin-bottom:30px;box-shadow:0 12px 35px #0000000a;overflow:hidden}.photo{min-height:360px;position:relative;background:#ddd;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;left:15px;top:15px;background:#1d1d1b;color:#e5c578;padding:9px 11px;font:700 12px Arial}.content{padding:40px 42px 36px}.eyebrow{font:700 10px Arial;letter-spacing:.15em;color:var(--gold);margin-bottom:12px}.content h2{font-size:35px;line-height:1.03;font-weight:400;margin:0 0 8px}.content h3{font-size:18px;font-style:italic;font-weight:400;color:#6e6457;margin:0 0 18px}.content p{font-size:17px;line-height:1.65;margin:0}.look{margin-top:20px;padding:14px 15px;border-left:3px solid var(--gold);background:#f7f1e7;font-size:13px;line-height:1.5}.look strong{font:700 10px Arial;letter-spacing:.1em}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.actions a{padding:12px 14px;text-decoration:none;font:700 10px Arial;letter-spacing:.06em;background:#1d1d1b;color:#fff}.actions .next{background:#fff;color:#1d1d1b;border:1px solid #1d1d1b}.end{background:#20201e;color:#fff;text-align:center;padding:85px 7vw}.end h2{font-size:52px;font-weight:400;margin:0 0 15px}.end p{max-width:720px;margin:0 auto 18px;font-size:18px;line-height:1.6;color:#ddd}.credits{max-width:900px;margin:35px auto 0;color:#999;font:10px Arial;line-height:1.55}
@media(max-width:760px){.nav{padding:6px 8px;gap:4px;justify-content:flex-start;overflow:hidden}.brand .logo{width:118px;height:50px}.tratto-lang{gap:2px}.tratto-lang button{width:25px;height:30px;flex-basis:25px;font-size:8px}.location{width:30px;height:30px;padding:0;margin-left:1px;font-size:0;display:grid;place-items:center;white-space:normal}.location::before{content:'📍';font-size:14px}.introgrid,.stop{grid-template-columns:1fr}.photo{min-height:260px}.content{padding:30px 22px}.hero{min-height:70vh;padding:50px 7vw}.goog-te-banner-frame{display:none!important}body{top:0!important}.skiptranslate{display:none!important}html,body{overflow-x:hidden!important}}
